name: CI/CD

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: runpod/flash

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.head_ref != 'release-please--branches--main'
    strategy:
      matrix:
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.11", "3.12"]') || fromJSON('["3.10", "3.11", "3.12", "3.13", "3.14"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Setup dependencies
        run: make setup

      - name: Run all tests with coverage
        run: make test-coverage

      # Renders the numbers into the run's summary page so they are readable
      # without downloading the artifact. Stdlib only — no extra install step.
      - name: Coverage summary
        if: always()
        run: |
          python - coverage.xml pytest-results.xml <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, sys, xml.etree.ElementTree as ET
          from pathlib import Path

          MAX_ROWS = 300
          cov, junit = sys.argv[1], sys.argv[2:]
          o = ["## Coverage Report", ""]


          def num(v, default=0):
              """Attribute values are text, and a malformed one must degrade rather than
              raise: this step runs under `if: always()`, so an exception here would
              stack a spurious failure on top of whatever actually went wrong."""
              try:
                  return int(v)
              except (TypeError, ValueError):
                  return default


          def parse(path):
              try:
                  return ET.parse(path).getroot(), None
              except (ET.ParseError, OSError) as e:
                  return None, e


          t = f = s = 0
          seen = False
          for pat in junit:
              for path in sorted(glob.glob(pat)):
                  r, _ = parse(path)
                  if r is None:
                      continue
                  seen = True
                  for su in (r.iter("testsuite") if r.tag == "testsuites" else [r]):
                      t += num(su.get("tests"))
                      f += num(su.get("failures")) + num(su.get("errors"))
                      s += num(su.get("skipped"))
          if seen:
              # A suite dying at import reports errors>0 with tests possibly 0, so
              # "no failures AND something actually ran" is what keeps a crashed run
              # from rendering as passed.
              ok = f == 0 and t > 0
              o += ["### Test Results", "",
                    "| Status | Passed | Failed | Skipped | Total |",
                    "|---|---:|---:|---:|---:|",
                    f"| {'✅ Passed' if ok else '❌ Failed'} | {t - f - s} | {f} | {s} | {t} |", ""]

          p = Path(cov)
          root, err = (None, None) if not p.exists() else parse(p)
          if root is None:
              o += [f"> No coverage report at `{cov}`." if err is None
                    else f"> Coverage report at `{cov}` could not be parsed: {err}"]
          else:
              c, v = num(root.get("lines-covered")), num(root.get("lines-valid"))
              o += ["### Coverage Summary", "", "| Metric | Value |", "|---|---:|",
                    f"| Line coverage | **{(100.0 * c / v if v else 0):.1f}%** |",
                    f"| Lines covered | {c:,} / {v:,} |",
                    f"| Lines missing | {v - c:,} |", ""]
              rows = []
              for cl in root.iter("class"):
                  ls = list(cl.iter("line"))
                  if ls:
                      h = sum(1 for x in ls if num(x.get("hits")) > 0)
                      rows.append((100.0 * h / len(ls),
                                   cl.get("filename") or cl.get("name") or "?", h, len(ls)))
              rows.sort(key=lambda r: (r[0], r[1]))
              if rows:
                  shown = rows[:MAX_ROWS]
                  o += ["<details>",
                        f"<summary>Per-file coverage ({len(rows)} files, least covered first)</summary>",
                        "", "| File | Coverage | Covered / Total |", "|---|---:|---:|"]
                  o += [f"| `{n}` | {q:.1f}% | {h} / {tt} |" for q, n, h, tt in shown]
                  # Capped so a growing repo cannot push the summary past GitHub's 1 MiB
                  # limit, which would truncate it silently.
                  if len(rows) > MAX_ROWS:
                      o += [f"| _…and {len(rows) - MAX_ROWS} more files_ | | |"]
                  o += ["", "</details>", ""]
          print("\n".join(o))
          PY

      # Consumed by the weekly coverage report, which reads the artifact from
      # the newest successful run on main. Name is per-matrix-version because
      # upload-artifact@v4 requires unique names within a run.
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

  lint:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.head_ref != 'release-please--branches--main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Check code formatting with ruff
        run: make format-check

      - name: Check code style with ruff
        run: make lint

  docker-test:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.head_ref != 'release-please--branches--main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CPU Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile-cpu
          platforms: linux/amd64
          push: false
          tags: flash-cpu:test
          build-args: |
            PYTHON_VERSION=3.11
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Test CPU handler execution in Docker environment
        run: |
          echo "Testing CPU handler in Docker environment..."
          docker run --rm flash-cpu:test ./test-handler.sh

  docker-test-lb-cpu:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.head_ref != 'release-please--branches--main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CPU Load Balancer Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile-lb-cpu
          platforms: linux/amd64
          push: false
          tags: flash-lb-cpu:test
          build-args: |
            PYTHON_VERSION=3.11
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Test LB handler execution in Docker environment
        run: |
          echo "Testing LB handler in Docker environment..."
          docker run --rm flash-lb-cpu:test ./test-lb-handler.sh

  docker-validation:
    runs-on: ubuntu-latest
    needs: [test, lint, docker-test, docker-test-lb-cpu]
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          results=("${{ needs.test.result }}" "${{ needs.lint.result }}" "${{ needs.docker-test.result }}" "${{ needs.docker-test-lb-cpu.result }}")
          for result in "${results[@]}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "One or more quality checks failed (got: $result)"
              exit 1
            fi
          done

  release:
    runs-on: ubuntu-latest
    needs: [docker-validation]
    if: github.ref == 'refs/heads/main'
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  docker-prod-gpu:
    runs-on: ubuntu-latest
    needs: [release]
    if: needs.release.outputs.release_created
    strategy:
      matrix:
        include:
          - python-version: "3.12"
            is-default: true
    steps:
      - name: Clear Space
        run: |
          rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          docker system prune -af
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build versioned tags
        id: tags
        run: |
          VERSION="${{ needs.release.outputs.tag_name }}"
          VERSION="${VERSION#v}"
          PYVER="${{ matrix.python-version }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAGS="${IMAGE}:py${PYVER}-${VERSION},${IMAGE}:py${PYVER}-latest"
          if [ "${{ matrix.is-default }}" = "true" ]; then
            TAGS="${TAGS},${IMAGE}:${VERSION},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Setup dependencies
        run: uv sync

      - name: Build and push GPU Docker image (prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=gpu
          cache-to: type=gha,mode=max,scope=gpu

  docker-prod-cpu:
    runs-on: ubuntu-latest
    needs: [release]
    if: needs.release.outputs.release_created
    strategy:
      matrix:
        include:
          - python-version: "3.10"
            is-default: false
          - python-version: "3.11"
            is-default: true
          - python-version: "3.12"
            is-default: false
    steps:
      - name: Clear Space
        run: |
          rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          docker system prune -af
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build versioned tags
        id: tags
        run: |
          VERSION="${{ needs.release.outputs.tag_name }}"
          VERSION="${VERSION#v}"
          PYVER="${{ matrix.python-version }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cpu"
          TAGS="${IMAGE}:py${PYVER}-${VERSION},${IMAGE}:py${PYVER}-latest"
          if [ "${{ matrix.is-default }}" = "true" ]; then
            TAGS="${TAGS},${IMAGE}:${VERSION},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Setup dependencies
        run: uv sync

      - name: Build and push CPU Docker image (prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile-cpu
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            PYTHON_VERSION=${{ matrix.python-version }}
          cache-from: type=gha,scope=cpu-py${{ matrix.python-version }}
          cache-to: type=gha,mode=max,scope=cpu-py${{ matrix.python-version }}

  docker-prod-lb:
    runs-on: ubuntu-latest
    needs: [release]
    if: needs.release.outputs.release_created
    strategy:
      matrix:
        include:
          - python-version: "3.12"
            is-default: true
    steps:
      - name: Clear Space
        run: |
          rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          docker system prune -af
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build versioned tags
        id: tags
        run: |
          VERSION="${{ needs.release.outputs.tag_name }}"
          VERSION="${VERSION#v}"
          PYVER="${{ matrix.python-version }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-lb"
          TAGS="${IMAGE}:py${PYVER}-${VERSION},${IMAGE}:py${PYVER}-latest"
          if [ "${{ matrix.is-default }}" = "true" ]; then
            TAGS="${TAGS},${IMAGE}:${VERSION},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Setup dependencies
        run: uv sync

      - name: Build and push Load Balancer Docker image (prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile-lb
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=lb
          cache-to: type=gha,mode=max,scope=lb

  docker-prod-lb-cpu:
    runs-on: ubuntu-latest
    needs: [release]
    if: needs.release.outputs.release_created
    strategy:
      matrix:
        include:
          - python-version: "3.10"
            is-default: false
          - python-version: "3.11"
            is-default: true
          - python-version: "3.12"
            is-default: false
    steps:
      - name: Clear Space
        run: |
          rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          docker system prune -af
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build versioned tags
        id: tags
        run: |
          VERSION="${{ needs.release.outputs.tag_name }}"
          VERSION="${VERSION#v}"
          PYVER="${{ matrix.python-version }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-lb-cpu"
          TAGS="${IMAGE}:py${PYVER}-${VERSION},${IMAGE}:py${PYVER}-latest"
          if [ "${{ matrix.is-default }}" = "true" ]; then
            TAGS="${TAGS},${IMAGE}:${VERSION},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Setup dependencies
        run: uv sync

      - name: Build and push CPU Load Balancer Docker image (prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile-lb-cpu
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            PYTHON_VERSION=${{ matrix.python-version }}
          cache-from: type=gha,scope=lb-cpu-py${{ matrix.python-version }}
          cache-to: type=gha,mode=max,scope=lb-cpu-py${{ matrix.python-version }}